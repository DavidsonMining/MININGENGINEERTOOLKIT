<!DOCTYPE html>
<html>
<head>
    <title>Stripping Ratio Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>⛏ Stripping Ratio Calculator</h1>
        <p>Calculate the ratio of overburden to ore</p>
    </header>

    <main>
        <h2>Enter Your Values</h2>

        <form>
            <label>Overburden Volume:</label>
            <input type="number" placeholder="e.g. 50000">

            <br><br>

            <label>Ore Volume:</label>
            <input type="number" placeholder="e.g. 10000">

            <br><br>

            <button type="submit">Calculate</button>
        </form>

        <br>

        <a href="/">← Back to Home</a>
    </main>

</body>
</html>
