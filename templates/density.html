<!DOCTYPE html>
<html>
<head>
    <title>Density Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>⚖️ Density Calculator</h1>
        <p>Calculate the density of a material</p>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/stripping-ratio">Stripping Ratio</a>
        <a href="/porosity">Porosity</a>
        <a href="/density">Density</a>
        <a href="/grade-recovery">Grade & Recovery</a>
        <a href="/bulk-density">Bulk Density</a>
    </nav>
    <main>
        <h2>Enter Your Values</h2>
        <form method="POST">
            <label>Mass:</label>
            <input type="number" name="mass" placeholder="e.g. 500" step="any" required>
            <br><br>
            <label>Mass Unit:</label>
            <select name="mass_unit" required>
                <option value="kg">Kilograms (kg)</option>
                <option value="g">Grams (g)</option>
            </select>
            <br><br>
            <label>Volume:</label>
            <input type="number" name="volume" placeholder="e.g. 100" step="any" required>
            <br><br>
            <label>Volume Unit:</label>
            <select name="volume_unit" required>
                <option value="m3">Cubic metres (m³)</option>
                <option value="cm3">Cubic centimetres (cm³)</option>
            </select>
            <br><br>
            <button type="submit">Calculate</button>
        </form>
        {% if result is not none %}
            <div class="result">
                <h2>Density = {{ result }} kg/m³</h2>
                <p>Formula: Density = Mass ÷ Volume</p>
            </div>
        {% endif %}
        <br>
        <a href="/">← Back to Home</a>
    </main>
</body>
</html>
